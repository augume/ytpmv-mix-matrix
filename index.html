<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTPMV Mix Style Matrix</title>
  <meta name="description" content="YTPMVのMixスタイルを2次元座標（空間演出・音作り）にプロット・管理するWebアプリケーション">
  <style>
    :root {
      --bg-color: #09090b;
      --panel-bg: #121215;
      --card-bg: #18181b;
      --card-border: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-purple: #8b5cf6;
      --accent-purple-hover: #7c3aed;
      --accent-gold: #fde047;
      --grid-line: #27272a;
      --axis-line: #52525b;
      --axis-text: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-main);
    }

    header .sub-info {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .main-container {
      display: flex;
      flex: 1;
      gap: 24px;
      padding: 24px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }
    }

    .canvas-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .canvas-wrapper {
      position: relative;
      width: 600px;
      height: 600px;
      background-color: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    canvas {
      display: block;
      width: 600px;
      height: 600px;
      cursor: crosshair;
    }

    .canvas-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .control-panel {
      flex: 1;
      min-width: 320px;
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group label span.val-badge {
      font-weight: 600;
      color: var(--accent-gold);
      font-family: monospace;
      font-size: 0.9rem;
    }

    input[type="text"] {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-purple);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--card-bg);
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-purple);
      cursor: pointer;
      border: 2px solid var(--panel-bg);
      transition: transform 0.1s ease, background-color 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      background: var(--accent-gold);
    }

    .btn {
      background-color: var(--accent-purple);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 10px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      background-color: var(--accent-purple-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .plot-list-wrapper {
      flex: 1;
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .plot-list-wrapper::-webkit-scrollbar {
      width: 6px;
    }
    .plot-list-wrapper::-webkit-scrollbar-track {
      background: var(--card-bg);
      border-radius: 3px;
    }
    .plot-list-wrapper::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 3px;
    }

    .empty-state {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      padding: 20px 0;
    }

    .plot-item {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.15s ease, background-color 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .plot-item:hover {
      border-color: var(--accent-purple);
      background-color: #201e29;
    }

    .plot-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .plot-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .plot-coords {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 16px 24px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>YTPMV Mix Style Matrix</h1>
    <div class="sub-info">空間演出（ドライ↔ウェット） × 音作り（素材の味重視↔音作り重視）</div>
  </header>

  <div class="main-container">
    <div class="canvas-section">
      <div class="canvas-wrapper">
        <canvas id="matrixCanvas"></canvas>
      </div>
      <div class="canvas-hint">Canvas上をクリックすると座標をスライダーに直接反映できます</div>
    </div>

    <div class="control-panel">
      <div class="panel-card">
        <h2>プロット編集</h2>
        <div class="form-group">
          <label for="author-name">作者名 / トラック名</label>
          <input type="text" id="author-name" placeholder="例: 音MAD作者A" maxlength="30">
        </div>

        <div class="form-group">
          <label for="x-slider">
            X軸: 空間演出 (ドライ ↔ ウェット)
            <span class="val-badge" id="x-val">0</span>
          </label>
          <input type="range" id="x-slider" min="-100" max="100" value="0">
        </div>

        <div class="form-group">
          <label for="y-slider">
            Y軸: 音作り (素材の味重視 ↔ 音作り重視)
            <span class="val-badge" id="y-val">0</span>
          </label>
          <input type="range" id="y-slider" min="-100" max="100" value="0">
        </div>

        <button type="button" class="btn" id="add-plot-btn">プロット追加 / 更新</button>
      </div>

      <div class="panel-card" style="flex: 1;">
        <h2>プロット一覧 (<span id="plot-count">0</span>)</h2>
        <div class="plot-list-wrapper" id="plot-list">
          <div class="empty-state">プロットデータを読み込み中...</div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    YTPMV Mix Style Matrix &copy; 2026
  </footer>

  <script>
    (function () {
      'use strict';

      // State Management
      const STORAGE_KEY = 'ytpmv_mix_matrix_plots';
      let plots = [];
      let hoveredPlotId = null;

      // DOM Elements
      const canvas = document.getElementById('matrixCanvas');
      const ctx = canvas.getContext('2d');
      const authorInput = document.getElementById('author-name');
      const xSlider = document.getElementById('x-slider');
      const ySlider = document.getElementById('y-slider');
      const xValBadge = document.getElementById('x-val');
      const yValBadge = document.getElementById('y-val');
      const addBtn = document.getElementById('add-plot-btn');
      const plotListEl = document.getElementById('plot-list');
      const plotCountEl = document.getElementById('plot-count');

      // Setup High-DPI Canvas Scaling (Retina / 4K Sharpness)
      function setupHiDPI() {
        const dpr = Math.max(window.devicePixelRatio || 1, 2);
        canvas.width = 600 * dpr;
        canvas.height = 600 * dpr;
        canvas.style.width = '600px';
        canvas.style.height = '600px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // Load plots from Shared Repository Master File (plots.json) and LocalStorage
      async function initData() {
        let sharedPlots = [];
        try {
          const response = await fetch('./plots.json?t=' + Date.now());
          if (response.ok) {
            sharedPlots = await response.json();
          }
        } catch (e) {
          console.warn('Shared plots file could not be fetched:', e);
        }

        let localPlots = [];
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            localPlots = JSON.parse(raw);
          }
        } catch (e) {
          console.error('Failed to load local plots:', e);
        }

        // Merge shared master plots and local additions (avoiding duplicates by name)
        const map = new Map();
        if (Array.isArray(sharedPlots)) {
          sharedPlots.forEach(p => map.set(p.name.toLowerCase(), p));
        }
        if (Array.isArray(localPlots)) {
          localPlots.forEach(p => map.set(p.name.toLowerCase(), p));
        }

        plots = Array.from(map.values());
        savePlots();
        renderList();
        draw();
      }

      // Save plots to LocalStorage
      function savePlots() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(plots));
        } catch (e) {
          console.error('Failed to save plots to localStorage:', e);
        }
      }

      // Coordinate Mapping Functions (Logical 600x600 space)
      function matrixToCanvas(x, y) {
        const cx = 300 + (x / 100) * 260; // 40px margin
        const cy = 300 - (y / 100) * 260;
        return { cx, cy };
      }

      function canvasToMatrix(cx, cy) {
        let x = Math.round(((cx - 300) / 260) * 100);
        let y = Math.round(((300 - cy) / 260) * 100);
        x = Math.max(-100, Math.min(100, x));
        y = Math.max(-100, Math.min(100, y));
        return { x, y };
      }

      // Draw Matrix Canvas
      function draw() {
        ctx.clearRect(0, 0, 600, 600);

        // Monochrome Background
        ctx.fillStyle = '#121215';
        ctx.fillRect(0, 0, 600, 600);

        // Quadrant Background Text
        ctx.save();
        ctx.font = '700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ドライ × 音作り重視', 170, 150);
        ctx.fillText('ウェット × 音作り重視', 430, 150);
        ctx.fillText('ドライ × 素材の味重視', 170, 450);
        ctx.fillText('ウェット × 素材の味重視', 430, 450);
        ctx.restore();

        // Sub Grid (every 25 units)
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#1d1d21';
        for (let v = -75; v <= 75; v += 25) {
          if (v === 0) continue;
          const { cx } = matrixToCanvas(v, 0);
          const { cy } = matrixToCanvas(0, v);
          
          ctx.beginPath();
          ctx.moveTo(cx, 40);
          ctx.lineTo(cx, 560);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(40, cy);
          ctx.lineTo(560, cy);
          ctx.stroke();
        }

        // Main Grid (every 50 units)
        ctx.strokeStyle = '#27272a';
        for (let v = -50; v <= 50; v += 50) {
          if (v === 0) continue;
          const { cx } = matrixToCanvas(v, 0);
          const { cy } = matrixToCanvas(0, v);

          ctx.beginPath();
          ctx.moveTo(cx, 40);
          ctx.lineTo(cx, 560);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(40, cy);
          ctx.lineTo(560, cy);
          ctx.stroke();
        }

        // Outer Border
        ctx.strokeStyle = '#3f3f46';
        ctx.strokeRect(40, 40, 520, 520);

        // Center Crosshair Axes
        ctx.strokeStyle = '#52525b';
        ctx.lineWidth = 2;

        // X Axis
        ctx.beginPath();
        ctx.moveTo(40, 300);
        ctx.lineTo(560, 300);
        ctx.stroke();

        // Y Axis
        ctx.beginPath();
        ctx.moveTo(300, 40);
        ctx.lineTo(300, 560);
        ctx.stroke();

        // Axis Titles & Endpoint Labels
        ctx.save();
        ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#a1a1aa';

        // X Axis Labels
        ctx.textAlign = 'left';
        ctx.fillText('← ドライ (-100)', 45, 318);
        ctx.textAlign = 'right';
        ctx.fillText('ウェット (+100) →', 555, 318);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#e4e4e7';
        ctx.fillText('【空間演出】', 510, 290);

        // Y Axis Labels
        ctx.textAlign = 'center';
        ctx.fillStyle = '#a1a1aa';
        ctx.fillText('音作り重視 (+100) ↑', 300, 30);
        ctx.fillText('素材の味重視 (-100) ↓', 300, 580);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#e4e4e7';
        ctx.fillText('【音作り】', 310, 55);

        ctx.restore();

        // Render Plotted Points
        plots.forEach(plot => {
          const { cx, cy } = matrixToCanvas(plot.x, plot.y);
          const isHovered = (plot.id === hoveredPlotId);

          ctx.save();

          if (isHovered) {
            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(139, 92, 246, 0.35)';
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(cx, cy, isHovered ? 7 : 5, 0, Math.PI * 2);
          ctx.fillStyle = isHovered ? '#a855f7' : '#8b5cf6';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.font = isHovered ? '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' : '500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillStyle = isHovered ? '#ffffff' : '#f4f4f5';
          ctx.textAlign = 'center';
          ctx.fillText(`${plot.name} (${plot.x}, ${plot.y})`, cx, cy - 10);

          ctx.restore();
        });

        // Current Selection Preview Point (5% Pale Gold Accent)
        const currentX = parseInt(xSlider.value, 10);
        const currentY = parseInt(ySlider.value, 10);
        const { cx: prevCx, cy: prevCy } = matrixToCanvas(currentX, currentY);

        ctx.save();
        ctx.beginPath();
        ctx.arc(prevCx, prevCy, 8, 0, Math.PI * 2);
        ctx.strokeStyle = '#fde047'; // Pale Gold
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(prevCx, prevCy, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#fde047';
        ctx.fill();
        ctx.restore();
      }

      // Update UI Controls & List
      function renderList() {
        plotCountEl.textContent = plots.length;

        if (plots.length === 0) {
          plotListEl.innerHTML = '<div class="empty-state">プロットデータがありません</div>';
          return;
        }

        plotListEl.innerHTML = '';
        plots.forEach(plot => {
          const item = document.createElement('div');
          item.className = 'plot-item';
          item.dataset.id = plot.id;
          item.title = 'クリックで編集 / Shift+クリックで削除';

          item.innerHTML = `
            <div class="plot-info">
              <div class="plot-name">${escapeHtml(plot.name)}</div>
              <div class="plot-coords">X: ${plot.x} / Y: ${plot.y}</div>
            </div>
          `;

          // Hover highlight
          item.addEventListener('mouseenter', () => {
            hoveredPlotId = plot.id;
            draw();
          });
          item.addEventListener('mouseleave', () => {
            hoveredPlotId = null;
            draw();
          });

          // Click handling: Normal click = edit, Shift+Click = delete
          item.addEventListener('click', (e) => {
            if (e.shiftKey) {
              if (confirm(`「${plot.name}」のプロットを削除しますか？`)) {
                deletePlotById(plot.id);
              }
              return;
            }
            authorInput.value = plot.name;
            xSlider.value = plot.x;
            ySlider.value = plot.y;
            updateSliderBadges();
            draw();
          });

          plotListEl.appendChild(item);
        });
      }

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function (m) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[m];
        });
      }

      function updateSliderBadges() {
        xValBadge.textContent = xSlider.value;
        yValBadge.textContent = ySlider.value;
      }

      // Add or Update Plot
      function addOrUpdatePlot() {
        const name = authorInput.value.trim();
        if (!name) {
          alert('作者名を入力してください');
          authorInput.focus();
          return;
        }

        const x = parseInt(xSlider.value, 10);
        const y = parseInt(ySlider.value, 10);

        const existingIndex = plots.findIndex(p => p.name.toLowerCase() === name.toLowerCase());

        if (existingIndex !== -1) {
          plots[existingIndex].x = x;
          plots[existingIndex].y = y;
          plots[existingIndex].name = name;
        } else {
          plots.push({
            id: Date.now().toString(),
            name: name,
            x: x,
            y: y
          });
        }

        savePlots();
        renderList();
        draw();
      }

      function deletePlotById(id) {
        plots = plots.filter(p => p.id !== id);
        savePlots();
        renderList();
        draw();
      }

      // Event Listeners
      xSlider.addEventListener('input', () => {
        updateSliderBadges();
        draw();
      });

      ySlider.addEventListener('input', () => {
        updateSliderBadges();
        draw();
      });

      addBtn.addEventListener('click', addOrUpdatePlot);

      authorInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          addOrUpdatePlot();
        }
      });

      // Canvas Click direct coordinate picking
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = 600 / rect.width;
        const scaleY = 600 / rect.height;

        const cx = (e.clientX - rect.left) * scaleX;
        const cy = (e.clientY - rect.top) * scaleY;

        const { x, y } = canvasToMatrix(cx, cy);

        xSlider.value = x;
        ySlider.value = y;
        updateSliderBadges();
        draw();
      });

      window.addEventListener('resize', () => {
        setupHiDPI();
        draw();
      });

      // Admin / Console APIs
      window.exportData = function () {
        return JSON.stringify(plots, null, 2);
      };

      window.importData = function (jsonInput) {
        try {
          const parsed = typeof jsonInput === 'string' ? JSON.parse(jsonInput) : jsonInput;
          if (Array.isArray(parsed)) {
            plots = parsed;
            savePlots();
            renderList();
            draw();
            return true;
          }
          return false;
        } catch (e) {
          return false;
        }
      };

      window.deletePlotByName = function (name) {
        if (!name) return false;
        plots = plots.filter(p => p.name.toLowerCase() !== name.trim().toLowerCase());
        savePlots();
        renderList();
        draw();
        return true;
      };

      window.clearAllData = function () {
        if (confirm('すべてのプロットデータを消去しますか？')) {
          plots = [];
          savePlots();
          renderList();
          draw();
        }
      };

      // Initialize
      setupHiDPI();
      updateSliderBadges();
      initData();

    })();
  </script>
</body>
</html>
